# CI for every pull request and every push to main (C2-PLAN-01, CS-1).
# No secrets are used here: the test suite needs neither network nor API keys.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # WeasyPrint native libs (same list as the Dockerfile) plus poppler,
      # so the pdftotext reading-order test runs here instead of skipping.
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libcairo2 \
            libgdk-pixbuf-2.0-0 shared-mime-info fonts-dejavu poppler-utils
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -rs

  frontend:
    name: frontend · tsc + build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Live interview mode end to end (C2-PLAN-01 CS-8, AC-09): Chromium with a
  # fake microphone, the real app, a fake Deepgram replaying a real recorded
  # Nova-3 session and a fake LLM. No secrets, no network beyond 127.0.0.1.
  e2e:
    name: e2e · live mode (fake audio)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            e2e/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native libraries (WeasyPrint, imported by the app)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libcairo2 \
            libgdk-pixbuf-2.0-0 shared-mime-info fonts-dejavu
      - run: pip install -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build the frontend against the E2E server
        working-directory: frontend
        run: |
          npm ci
          VITE_API_URL=http://127.0.0.1:8123 npm run build
      # AC-12: the browser bundle never carries a Deepgram endpoint or key.
      - name: No Deepgram in the bundle
        run: |
          ! grep -rIiE "api\.deepgram\.com|DEEPGRAM_API_KEY|Token [0-9a-f]{20,}" frontend/dist
      - run: python -m pytest e2e -v

  # CareerAI MCP server (LB03-PLAN-01, CS-1). Python 3.10 is the floor that
  # mcp/pyproject.toml declares; code that passes there runs on newer ones.
  mcp:
    name: mcp · pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: mcp/pyproject.toml
      - run: pip install -e ".[test]"
      - run: python -m pytest -q -rs
      # Smoke test of the installed entry point (AC-04); the suite also runs
      # a real stdio session.
      - run: careerai-mcp --check

  image:
    name: production image · build + boot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Same Dockerfile and build arg Heroku uses (read from heroku.yml, so
      # there is a single source for the value).
      - name: Build the Heroku image
        run: |
          VITE_API_URL=$(sed -n 's/^ *VITE_API_URL: *//p' heroku.yml)
          test -n "$VITE_API_URL"
          docker build --build-arg VITE_API_URL="$VITE_API_URL" -t career-ai:ci .
      # Boot it with heroku.yml's own run.web command (read from the file, so
      # its flags are tested too), then probe the API and the frontend that
      # FastAPI serves.
      - name: Boot and probe
        run: |
          RUN_WEB=$(sed -n '/^run:/,$ s/^ *web: *//p' heroku.yml)
          test -n "$RUN_WEB"
          docker run -d --name app -p 8000:8000 -e PORT=8000 career-ai:ci sh -c "$RUN_WEB"
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/health | grep -q '"ok"'
          curl -fsS localhost:8000/ | grep -q '<div id="root">'
      - name: Container logs
        if: failure()
        run: docker logs app || true
