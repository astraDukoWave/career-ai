# CS-0 of C2-PLAN-01: STT provider benchmark (spike).
# Runs only when the benchmark itself changes in a PR, or on demand. Uses the
# DEEPGRAM_API_KEY repo secret (not available to workflows from forks) and
# posts the results table as a PR comment. No audio is committed or uploaded.
name: STT benchmark

on:
  pull_request:
    paths:
      - backend/scripts/stt_benchmark.py
      - .github/workflows/stt-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: stt-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ffmpeg and the Deepgram SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install deepgram-sdk==7.1.1
      - name: Run the benchmark
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: python scripts/stt_benchmark.py --out stt-benchmark-out
      - name: Job summary
        if: always()
        run: cat stt-benchmark-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file stt-benchmark-out/report.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stt-benchmark
          path: |
            backend/stt-benchmark-out/report.md
            backend/stt-benchmark-out/samples.json
            backend/stt-benchmark-out/spans.json
