build:
  docker:
    web: Dockerfile
  config:
    VITE_API_URL: https://career-ai-95daf7c9a813.herokuapp.com
run:
  # One process (the live-session limiter counts in memory) and WebSocket
  # frames capped at 1 MiB, no compression: uvicorn buffers each message
  # before the app sees it, so this bounds memory per socket (C2 CS-4 review).
  web: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --ws-max-size 1048576 --ws-max-queue 8 --ws-per-message-deflate false
