[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerai-mcp"
version = "0.1.0"
description = "Use CareerAI (CV tailoring + interview suggestions) from Claude Code or Claude Desktop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
careerai-mcp = "careerai_mcp.__main__:main"

[tool.setuptools]
packages = ["careerai_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
